version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ../../services/api:/app
    depends_on:
      - agent
    networks:
      - studystreak-network

  agent:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ../../services/agent:/app
    networks:
      - studystreak-network

networks:
  studystreak-network:
    driver: bridge